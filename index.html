<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Baton smoketest</title>
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #faf9f7;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
        color: #1a1a1a;
      }
      main {
        max-width: 560px;
        padding: 48px 32px;
        text-align: left;
      }
      h1 {
        font-size: 64px;
        font-weight: 800;
        letter-spacing: -0.03em;
        margin: 0 0 8px;
        color: #10B981;
      }
      h2 {
        font-size: 32px;
        font-weight: 700;
        letter-spacing: -0.02em;
        margin: 0 0 16px;
        color: #1a1a1a;
      }
      p {
        font-size: 17px;
        line-height: 1.6;
        color: #4a4a4a;
        margin: 0 0 32px;
      }
      button {
        background: #10B981;
        color: white;
        padding: 12px 24px;
        border: none;
        border-radius: 8px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover {
        background: #059669;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>HEY PAUL</h1>
      <h2>Baton smoketest</h2>
      <p>
        Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod
        tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim
        veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea
        commodo consequat.
      </p>
      <button type="button">Share with PM</button>
    </main>
  </body>
</html>
